<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href ="style.css"
    <title>Document</title>
       
</head>
<body>
    <form action="index.html" method="post">

        <lable for="Name">Name</lable>
        <input 
            id="Name" 
            type="text" 
            name="Name" 
            placeholder="enter name" >
        <br><br>

        <lable for="">Email</lable>
        <input 
            id="email"
            name="email"
            placeholder="email"
            type="email"
            value="email">
        <br><br>

        <lable for="password">Password</lable>
        <input
            id="pass"
            name="password"
            type="password"
            minlength="4"
            maxlength="10">
        <br><br>

        <lable for="search">Search</lable>
        <input
            name="search"
            type="search">
        <br><br>

        <lable for="Phone">Phone</lable>
        <input 
            name="Phone"
            type="tel"
            minlength="10"
            maxlength="10">
        <br><br>

        <lable for="web">Website</lable>
        <input
        name="web"
        type="url">
        <br><br>

        <lable for="age"><b>Age:</b></lable>
        <input 
           name="age"
           type="number"
           minlength="18"
           maxlength="65"
           placeholder="18">
        <br><br>

        <lable for="date">Date</lable>
        <input 
            name="date"
            type="date">
        <br><br>

    </form>
    <br>
    <div style="text-align: center;">
    <video controls muted autoplay height="500" width="500">
        <source src="video.mp4" type="video/mp4">
    </video>
    <br>
    <audio controls>
        <source src="audio.mp3" type="audio/mp3">
    </audio>
    </div>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/-BqVKDB9sDw?si=CdwbXSYcgUC10cxI" title="YouTube video player" 
    frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


    
</body>
</html>
